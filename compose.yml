services:
  app:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env.docker
    depends_on:
      - db
    volumes:
      - .:/app

  db:
    image: postgres:18.3
    environment:
      POSTGRES_USER: longnguyen
      POSTGRES_DB: postgres
      POSTGRES_HOST_AUTH_METHOD: trust 
    volumes:
      - dbdata:/var/lib/docker/volumes/dbdata
    ports:
      - "5432:5432"

volumes:
  dbdata: